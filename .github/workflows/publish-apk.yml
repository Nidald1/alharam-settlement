name: Publish Android APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Public URL of the APK to attach
        required: true
        type: string
      tag:
        description: Existing release tag
        required: true
        default: v2
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: curl -L --fail --retry 3 --retry-delay 3 -o alharam-settlement.apk "${{ inputs.apk_url }}"
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Nidald1/alharam-settlement
        run: gh release upload "${{ inputs.tag }}" alharam-settlement.apk --clobber
